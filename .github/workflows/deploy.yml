# CI/CD for the qed64-zulip-bot Worker. `npm test` runs on every push and pull request;
# a push to main (or a manual run) then deploys with wrangler. Required repository
# secrets: CLOUDFLARE_API_TOKEN (an API token with Workers Scripts: Edit on the account)
# and CLOUDFLARE_ACCOUNT_ID. The Zulip token is a Worker secret (ZULIP_BOT_TOKEN, set
# once with `wrangler secret put`, outside this workflow) and survives every deploy.
# No lockfile and no dependencies: wrangler is fetched at a pinned version; keep that
# pin in step with the compatibility_date note in wrangler.toml.
name: deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes wrangler@4.125.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
