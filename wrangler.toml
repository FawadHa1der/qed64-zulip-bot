# qed64-zulip-bot: deployed by .github/workflows/deploy.yml on every push to main (wrangler
# 4.125.0, pinned there; this repository has no dependencies), or by hand with the same
# command, `npx --yes wrangler@4.125.0 deploy`.
# The secret ZULIP_BOT_TOKEN is set once with `wrangler secret put ZULIP_BOT_TOKEN`
# and never appears in this file. See README.md for the runbook.

name = "qed64-zulip-bot"
main = "src/worker.mjs"
compatibility_date = "2026-08-01" # must not exceed the workerd the pinned wrangler bundles (4.125.0: 2026-08-20); nothing here needs a newer date

[vars]
QED64_ORIGIN = "https://qed64.fawadworkaddress.workers.dev"
